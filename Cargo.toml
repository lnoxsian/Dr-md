[workspace]
members = [
    ".",
    "crates/egui_commonmark",
]

[package]
name = "dr-md"
version = "0.2.4"
edition = "2024"

[dependencies]
eframe = "0.27"
egui = "0.27"
image = { version = "0.24", default-features = false, features = ["png", "webp", "jpeg", "gif", "bmp", "tiff"] }
egui_commonmark = { path = "crates/egui_commonmark", features = ["better_syntax_highlighting", "fetch", "svg"] }
urlencoding = "2.1.3"
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "5"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
rfd = "0.14"
arboard = "3.6.1"
url = "2.5"
regex = "1.10"
tikv-jemallocator = "0.6"

[profile.release]

[profile.optimized]
inherits = "release"
opt-level = 3        # Optimize aggressively for smallest binary size
lto = "fat"          # Full LTO for maximum cross-crate dead code elimination
codegen-units = 1    # Single codegen unit for global optimization scope
strip = true         # Strip all symbols and debuginfo
panic = "abort"      # Remove panic unwinding overhead
overflow-checks = false # Disable integer overflow checks in release for max performance
