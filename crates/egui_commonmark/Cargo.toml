[package]
edition = "2021"
rust-version = "1.80"
name = "egui_commonmark"
version = "0.15.0"
authors = ["Erlend Walstad"]
description = "Commonmark viewer for egui"
documentation = "https://docs.rs/egui_commonmark"
readme = "README.md"
keywords = [
    "commonmark",
    "egui",
]
categories = ["gui"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/lampsitter/egui_commonmark"

[dependencies.ratex-types]
version = "0.1"

[dependencies.ratex-parser]
version = "0.1"

[dependencies.ratex-layout]
version = "0.1"

[dependencies.ratex-svg]
version = "0.1"
features = ["standalone", "embed-fonts"]

[dependencies.image]
version = "0.24"
default-features = false
features = ["png", "webp", "jpeg", "gif", "bmp", "tiff"]

[dependencies.egui]
version = "0.27"

[dependencies.egui_extras]
version = "0.27"

[dependencies.merman]
version = "0.8.0-alpha.3"
features = ["render", "raster", "elk-layout"]

[dependencies.pulldown-cmark]
version = "0.10"
optional = true
default-features = false

[dependencies.syntect]
version = "5.0.0"
features = ["default-fancy"]
optional = true
default-features = false

[features]
better_syntax_highlighting = ["syntect"]
default = [
    "load-images",
    "pulldown_cmark",
]
fetch = ["egui_extras/http"]
load-images = [
    "egui_extras/image",
    "egui_extras/file",
]
pulldown_cmark = ["dep:pulldown-cmark"]
svg = ["egui_extras/svg", "egui_extras/resvg"]
